<!DOCTYPE html>
<html>

<head>
  <title> Canvas Based Bouncing Box </title>
  <style>
    body {

      height: 1vh;
      width: 1vh;
      min-height: 100vh;
      background-color: rgb(255, 0, 0);
    }



    .board {
      position: absolute;
      height: 100%;
      width: 100%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background-color: rgb(0, 0, 0);
      border-color: white;
    }



    .game-data {
      position: absolute;
      left: 2%;
      width: 275px;
      height: 40px;
    }

    .game-data p {
      color: white;
      font-size: 40px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: Copperplate, Papyrus, fantasy;
      background-color: rgba(255, 150, 202, 0.637);
    }
  </style>
</head>

<body style="background-color: white;">
  <div class='board'>
    <div class='game-data'>
      <p> Boxes: 0</p>
    </div>

    <canvas id="canvas"></canvas>



  </div>

  <script type='module' src='behavior.js'></script>
</body>

</html>
